name: Deploy to Production

on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false   # nunca cancelar un deploy en curso

jobs:
  validate-and-deploy:
    name: TypeScript check + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --prefer-offline

      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit
        # Si hay error de tipos, el deploy NO corre — producción nunca recibe código roto

      - name: Deploy to Vercel (production)
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest --silent
          # Deploy directo a Vercel — el build corre en sus servidores con las env vars reales
          vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://responbot.vercel.app/api/keepalive)
          echo "Smoke test status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ADVERTENCIA: smoke test devolvio $STATUS"
          fi
